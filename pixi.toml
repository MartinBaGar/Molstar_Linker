[workspace]
authors = ["Martin Bari Garnier <martbari.g@gmail.com>"]
channels = ["conda-forge"]
name = "Molstar_Linker"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
hugo = ">=0.163.3,<0.164"
nodejs = ">=26.4.0,<26.5"
prettier = ">=3.9.3,<4"
pnpm = ">=11.10.0,<12"

# ── Shared directory variables, available as $VAR in every task ──────────────
[activation.env]
SRC_DIR      = "src"
DIST_DIR     = "dist"
RELEASES_DIR = "releases"
DOCS_DIR     = "docs"

# ── Tasks ─────────────────────────────────────────────────────────────────────

# 0. INSTALL — pixi run install
[tasks.install]
description = "Install npm dependencies"
cmd         = "pnpm ci"

# 1. DAILY DEV — pixi run save "my message"
[tasks.save]
description = "Stage all changes, commit with a message, and push to main"
cmd         = 'git add . && git commit -m "{{ msg }}" && git push origin main'

[tasks.setup]
description = "Install pixi env + npm dependencies in one command"
cmd         = "pnpm install --frozen-lockfile"
inputs      = ["pnpm-lock.yaml"]
outputs     = ["node_modules/.pnpm/lock.yaml"]

[tasks.typecheck]
description = "Type-check the project without emitting output"
cmd         = "pnpm typecheck"

[tasks.bump]
description = "Bump the extension version in package.json"
args        = ["version"]
cmd         = """
echo "Bumping version to {{ version }}..." &&
pnpm version {{ version }} --no-git-tag-version --allow-same-version &&
echo "✅ Version bumped to {{ version }} in package.json"
"""

# 4. BUILD
[tasks.build-chrome]
description = "Build the Chrome (MV3) extension with Vite into dist/chrome/"
cmd         = "pnpm run build:chrome"

[tasks.build-firefox]
description = "Build the Firefox (MV2) extension with Vite into dist/firefox/"
cmd         = "pnpm run build:firefox"

[tasks.build]
description = "Build both Chrome and Firefox extensions"
depends-on  = ["build-chrome", "build-firefox"]

# 5. ZIP — pixi run zip 1.2.3
[tasks.zip]
description = "Build (if needed) then zip both extensions and the source code for Mozilla review"
args        = ["version"]
depends-on  = ["build"]
cmd         = """
echo "Zipping extensions v{{ version }}..." &&
mkdir -p $RELEASES_DIR &&
(cd $DIST_DIR/chrome && zip -r ../../$RELEASES_DIR/molstar_linker_chrome-v{{ version }}.zip . -x "*.DS_Store" > /dev/null) &&
(cd $DIST_DIR/firefox && zip -r ../../$RELEASES_DIR/molstar_linker_firefox-v{{ version }}.zip . -x "*.DS_Store" > /dev/null) &&
echo "Zipping source code for Mozilla review..." &&
zip -r $RELEASES_DIR/molstar_linker_source-v{{ version }}.zip \
    $SRC_DIR public *.html *.config.ts package.json pnpm-lock.yaml \
    pixi.toml pixi.lock tsconfig.json README.md \
    -x "*.DS_Store" > /dev/null &&
echo "✅ Packages and source code ready in $RELEASES_DIR/"
"""

# 6. RELEASE — pixi run publish 1.2.3
#    Sequential steps with ordering constraints mean a bash script is cleaner
#    than trying to wire all of this through depends-on alone.
[tasks.publish]
description = "Full release pipeline: typecheck → bump → build → zip → commit → tag → push → GitHub release"
args        = ["version"]
cmd         = """
bash -c '
set -e

echo "==> [1/5] Type-checking..."
pixi run typecheck

echo "==> [2/5] Bumping version..."
pixi run bump {{ version }}

echo "==> [3/5] Building and zipping..."
pixi run zip {{ version }}

echo "==> [4/5] Committing, tagging, and pushing..."
git add package.json package-lock.json
git commit -m "chore: bump version to v{{ version }}" \
    || echo "Nothing to commit — version already at {{ version }}."
git tag v{{ version }}
git push origin main
git push origin main --tags

echo "==> [5/5] Creating GitHub release..."
if command -v gh &>/dev/null; then
    gh release create v{{ version }} \
        $RELEASES_DIR/molstar_linker_chrome-v{{ version }}.zip \
        $RELEASES_DIR/molstar_linker_firefox-v{{ version }}.zip \
        --title "Release v{{ version }}" \
        --generate-notes
    echo "🚀 Release v{{ version }} published!"
else
    echo "⚠️  gh CLI not found. Upload the .zips from $RELEASES_DIR/ manually."
fi
'
"""

# 7. CLEANUP
[tasks.clean]
description = "Remove the dist/ and releases/ directories"
cmd         = "rm -rf $DIST_DIR $RELEASES_DIR && echo '✅ Cleaned dist/ and releases/'"

# 8. DEV SERVER (extension)
[tasks.dev]
description = "Start WXT in watch mode for Chrome (launches isolated browser with HMR)"
cmd         = "pnpm run dev:chrome"

[tasks.dev-firefox]
description = "Start WXT in watch mode for Firefox (launches isolated browser with HMR)"
cmd         = "pnpm run dev:firefox"

# 9. DOCS SITE (Hugo)
[tasks.serve]
description = "Start the Hugo development server (with drafts)"
cmd         = "echo 'Starting Hugo server in $DOCS_DIR...' && hugo server -s $DOCS_DIR -D --disableFastRender"

[tasks.build-site]
description = "Build the Hugo static site for production"
cmd         = "hugo --minify"
