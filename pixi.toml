[workspace]
authors = ["Martin Bari Garnier <martbari.g@gmail.com>"]
channels = ["conda-forge"]
name = "Molstar_Linker"
platforms = ["linux-64"]

[dependencies]
nodejs = ">=26.4.0,<26.5"
pnpm = ">=11.10.0,<12"
typescript-language-server = ">=6.0.1,<7"
svelte-language-server = ">=0.18.4,<0.19"

# ── Install and checks ─────────────────────────────────────────

[tasks.setup]
description = "Install JavaScript dependencies from the lockfile"
cmd = "pnpm install --frozen-lockfile"

[tasks.typecheck]
description = "Check TypeScript and Svelte"
cmd = "pnpm check"

[tasks.test]
description = "Run unit tests"
cmd = "pnpm test"

# ── Development ────────────────────────────────────────────────

[tasks.dev-chrome]
description = "Run WXT for Chrome"
cmd = "pnpm run dev-chrome"

[tasks.dev-firefox]
description = "Run WXT for Firefox"
cmd = "pnpm run dev-firefox"

[tasks.dev-firefox-android]
description = "Load the running Firefox dev build on a connected Android device"
cmd = """
bash -euo pipefail -c '
device="$(adb devices | awk "NR > 1 && \\$2 == \\"device\\" {print \\$1; exit}")"
test -n "$device" || { echo "No authorized Android device found."; exit 1; }
test -f .output/firefox-mv3-dev/manifest.json || {
    echo "Start the Firefox dev build first."; exit 1;
}
adb reverse tcp:3000 tcp:3000
pnpm exec web-ext run \
    --source-dir .output/firefox-mv3-dev \
    --target firefox-android \
    --android-device "$device"
'
"""

# ── Build and release ──────────────────────────────────────────

[tasks.build]
description = "Build the Chrome and Firefox extensions"
cmd = "pnpm run build"

[tasks.zip]
description = "Create Chrome, Firefox, and Firefox-source ZIPs"
cmd = "pnpm run zip"

[tasks.bump]
description = "Set the version in package.json without committing or tagging"
args = ["version"]
cmd = "pnpm version {{ version }} --no-git-tag-version"

[tasks.publish]
description = "Check, package, tag, push, and create a GitHub release"
cmd = """
bash -euo pipefail -c '
test -z "$(git status --porcelain)" || {
    echo "Commit or discard your changes before publishing."
    exit 1
}
command -v gh >/dev/null || {
    echo "Install and authenticate the GitHub CLI first."
    exit 1
}
gh auth status >/dev/null

version="$(node -p "require(\\"./package.json\\").version")"
tag="v$version"
if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
    echo "Tag $tag already exists."
    exit 1
fi

pnpm check
pnpm test
pnpm run zip

shopt -s nullglob
chrome=(.output/*-"$version"-chrome.zip)
firefox=(.output/*-"$version"-firefox.zip)
sources=(.output/*-"$version"-sources.zip)

if [[ ! -f "${chrome[0]:-}" || -n "${chrome[1]:-}" ||
    ! -f "${firefox[0]:-}" || -n "${firefox[1]:-}" ||
    ! -f "${sources[0]:-}" || -n "${sources[1]:-}" ]]; then
  echo "Expected exactly one Chrome, Firefox, and source ZIP for $version."
  exit 1
fi

git tag "$tag"
git push origin HEAD
git push origin "$tag"

gh release create "$tag" \
    "${chrome[0]}" "${firefox[0]}" "${sources[0]}" \
    --title "Release $tag" \
    --generate-notes

echo "GitHub release $tag created."
'
"""

[tasks.clean]
description = "Remove WXT build output"
cmd = "rm -rf .output"

# ── Documentation ──────────────────────────────────────────────

[tasks.serve]
description = "Serve the documentation locally"
cmd = "pnpm dlx serve docs -l 3000"

[tasks.build-site]
description = "Build the Org documentation site"
cmd = "emacs -Q --batch -l build.el"
